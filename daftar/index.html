<style>
@import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono&display=swap");
:root{--bg:#131210;--panel:#1b1a17;--raised:#24231f;--hover:#2b2924;--text:#e8e6e0;--muted:#918e85;--faint:#656159;--line:#302e29;--accent:#78dcca;--accentbg:#213d37;--danger:#ee8b83;color-scheme:dark;font-family:Vazirmatn,Tahoma,sans-serif}
html.light{--bg:#f7f6f2;--panel:#fffefa;--raised:#efede7;--hover:#e8e5de;--text:#282722;--muted:#77736a;--faint:#9d988e;--line:#e1ded6;--accent:#168675;--accentbg:#dceee8;--danger:#bd4942;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.35}::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}.hidden{display:none!important}.icon{width:34px;height:34px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:inline-grid;place-items:center;font-size:17px}.icon:hover{background:var(--hover);color:var(--text)}kbd{font:10px inherit;direction:ltr;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--faint)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,var(--accentbg),transparent 40%),var(--bg)}.auth form{width:min(400px,100%);padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 25px 70px #0004}.logo{display:flex;align-items:center;gap:11px;margin-bottom:22px}.logo b{font-size:25px}.logo span,.brand span{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:var(--accentbg);color:var(--accent);font-size:22px}.logo p{margin:3px 0;color:var(--muted)}.auth label{display:block;color:var(--muted);font-size:12px;margin:15px 0}.auth input:not([type=checkbox]){display:block;width:100%;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);outline:0}.auth input:focus{border-color:var(--accent)}.primary{border:0;border-radius:8px;background:var(--accent);color:#102d27;font-weight:600;padding:11px 16px}.auth .primary{width:100%;margin-top:10px}.note{font-size:10px;line-height:1.9;color:var(--faint);text-align:center;margin-top:15px}.error{color:var(--danger);font-size:12px}
.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:275px;flex:0 0 275px;background:var(--panel);border-left:1px solid var(--line);padding:17px 12px 12px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:10px;padding:0 5px 18px}.brand span{width:35px;height:35px;font-size:18px}.brand b{display:block;font-size:19px}.brand small{color:var(--muted);font-size:10px}.brand .icon{margin-right:auto;display:none}.new,.search{width:100%;height:39px;border-radius:7px;display:flex;align-items:center;gap:9px;padding:0 11px}.new{border:0;background:var(--accent);color:#102d27;font-weight:600;margin-bottom:9px}.new kbd,.search kbd{margin-right:auto}.new kbd{color:#17463c;border-color:#0002}.search{border:1px solid var(--line);background:transparent;color:var(--muted);margin-bottom:15px}.nav{display:grid;border-bottom:1px solid var(--line);padding-bottom:13px}.nav button,.bottom>button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:6px;text-align:right}.nav button:hover,.nav button.active,.bottom>button:hover{background:var(--hover);color:var(--text)}.nav button i{font-style:normal;margin-right:auto;color:var(--faint);font-size:11px}.treehead{display:flex;justify-content:space-between;padding:17px 10px 7px;color:var(--faint);font-size:11px}.treehead button{border:0;background:transparent;color:var(--muted)}.tree{overflow:auto;flex:1}.row{height:34px;display:flex;align-items:center;border-radius:6px;color:var(--muted);padding-right:calc(var(--d)*14px)}.row:hover{background:var(--hover)}.row.active{background:var(--accentbg);color:var(--accent)}.row .exp{width:24px;border:0;background:transparent;color:var(--faint)}.row .label{flex:1;min-width:0;border:0;background:transparent;color:inherit;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .add{opacity:0;border:0;background:transparent;color:var(--muted);width:25px}.row:hover .add{opacity:1}.bottom{border-top:1px solid var(--line);padding-top:9px}.bottom>button{width:100%;font-size:12px}.local{color:var(--faint);font-size:10px;padding:13px 10px 2px}.local:before{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-left:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;flex:0 0 58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 21px;gap:10px}.crumbs{display:flex;align-items:center;gap:4px;min-width:0;color:var(--faint);font-size:12px}.crumbs button{border:0;background:transparent;color:inherit;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumbs button:last-child{color:var(--text)}.topstart,.actions{display:flex;align-items:center;gap:3px;min-width:0}.menu{display:none}.actions button{white-space:nowrap}.textbtn{height:34px;border:0;border-radius:7px;background:transparent;color:var(--muted);padding:0 10px}.textbtn:hover,.textbtn.active{background:var(--hover);color:var(--text)}.scroll{flex:1;overflow:auto}.doc{width:min(810px,calc(100% - 64px));margin:auto;padding:55px 0 90px}.meta{display:flex;align-items:center;color:var(--faint);font-size:10px;min-height:34px}.pagetools{display:flex;margin-right:auto}.title{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:37px;font-weight:700;padding:10px 0;resize:none;overflow:hidden}.tags{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0 13px;margin-bottom:27px;color:var(--faint)}.tags button{border:0;border-radius:5px;background:var(--raised);color:var(--muted);font-size:10px;padding:4px 7px}.tags input{flex:1;min-width:100px;border:0;outline:0;background:transparent;color:var(--muted);font-size:11px}
.block{position:relative;display:flex;align-items:flex-start;gap:7px;margin:3px 0}.block textarea{width:100%;min-height:35px;resize:none;overflow:hidden;border:0;outline:0;background:transparent;color:var(--text);line-height:1.95;padding:4px 0}.block .tools{position:absolute;left:-53px;top:3px;display:flex;opacity:0}.block:hover .tools{opacity:1}.tools button{border:0;background:transparent;color:var(--faint);padding:4px}.h1 textarea{font-size:29px;font-weight:700;padding-top:15px}.h2 textarea{font-size:23px;font-weight:600;padding-top:11px}.h3 textarea{font-size:18px;font-weight:600}.quote{border-right:3px solid var(--accent);padding-right:13px}.quote textarea{color:var(--muted)}.code{background:#101513;border:1px solid #29342f;border-radius:8px;padding:10px 13px;margin:8px 0;direction:ltr}.code textarea{font:13px/1.8 "JetBrains Mono",monospace;color:#b6e8d7;text-align:left;min-height:65px}.bullet:before{content:"•";color:var(--accent);font-size:20px;line-height:32px}.numbered:before{content:"۱.";color:var(--accent);line-height:32px}.todo:before{content:"☐";color:var(--accent);line-height:32px;cursor:pointer}.todo.done:before{content:"☑"}.todo.done textarea{text-decoration:line-through;color:var(--muted)}.flash{padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.flash:before{content:"؟";color:var(--accent);font-weight:700}.flash .answer{display:block;width:100%;border:0;border-top:1px solid var(--line);outline:0;background:transparent;color:var(--muted);padding:8px 0;resize:none}.divider{border-top:1px solid var(--line);margin:20px 0}.image img{max-width:100%;border-radius:8px}.image input{color:var(--muted);font-size:11px}.addblock{border:0;background:transparent;color:var(--faint);font-size:11px;padding:10px 0}.slash{position:absolute;z-index:10;right:0;top:100%;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px;box-shadow:0 12px 40px #0005}.slash button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:8px;border-radius:5px;color:var(--muted)}.slash button:hover{background:var(--hover);color:var(--accent)}
.status{height:27px;border-top:1px solid var(--line);display:flex;align-items:center;gap:15px;padding:0 17px;color:var(--faint);font-size:9px}.status button{margin-right:auto;border:0;background:transparent;color:var(--faint)}.modalback{position:fixed;inset:0;z-index:50;background:#080807aa;backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:10vh 18px 20px}.modal{width:min(570px,100%);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 25px 80px #0006}.modal header{display:flex;justify-content:space-between;align-items:center;padding:19px 21px 12px}.modal h2{font-size:17px;margin:0}.modalbody{padding:0 17px 18px}.modalbody>input{width:100%;height:45px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--text);outline:0;padding:0 12px;margin-bottom:12px}.result{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:7px;text-align:right}.result:hover{background:var(--hover)}.result span{flex:1}.result b,.result small{display:block}.result b{color:var(--text)}.result small{color:var(--faint);margin-top:4px}.empty{text-align:center;color:var(--faint);padding:35px}.study{height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:25px;cursor:pointer}.study p{font-size:20px;line-height:1.9}.study small{color:var(--faint)}.cardnav{display:flex;justify-content:center;gap:30px;padding-top:18px}.cardnav button,.export button,.trashitem button{border:0;background:transparent;color:var(--muted);padding:7px}.export>button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border-bottom:1px solid var(--line);padding:14px 5px}.export b,.export small{display:block}.export small{color:var(--muted);font-size:10px;margin-top:4px}.trashitem{display:flex;align-items:center;gap:9px;padding:11px;border-bottom:1px solid var(--line)}.trashitem span{flex:1}.trashitem button:last-child{color:var(--danger)}.toast{position:fixed;z-index:100;bottom:40px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:8px;padding:10px 16px;font-size:12px;box-shadow:0 8px 30px #0004}.preview p{line-height:2}.preview pre{direction:ltr;text-align:left;background:#101513;color:#b6e8d7;padding:14px;border-radius:8px;white-space:pre-wrap}.preview blockquote{border-right:3px solid var(--accent);padding-right:13px;color:var(--muted)}.scrim{display:none}
@media(max-width:850px){.sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(105%);transition:.2s;box-shadow:-15px 0 50px #0005}.sidebar.open{transform:none}.brand .icon,.menu{display:inline-grid}.scrim.show{display:block;position:fixed;inset:0;background:#0008;z-index:19;border:0}.doc{width:calc(100% - 38px);padding-top:32px}.top{padding:0 11px}.block .tools{left:0;opacity:.4}}
@media(max-width:520px){.title{font-size:29px}.doc{width:calc(100% - 30px)}.crumbs button:not(:last-child){display:none}.actions .undo{display:none}.textbtn{font-size:0}.textbtn:after{content:"◫";font-size:17px}.block .tools{display:none}.meta>span{display:none}.status{display:none}.modalback{padding:5vh 11px}.auth form{padding:25px}}
</style>

<body>
<div id="root"></div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const KEY="new-daftar-data-v1",LOCK="new-daftar-lock-v1",SESSION="new-daftar-session-v1";
const uid=()=>crypto.randomUUID(),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const B=(type="text",text="",extra={})=>({id:uid(),type,text,...extra});
function seed(){let now=Date.now(),p=(title,parentId=null,blocks=[B()])=>({id:uid(),title,parentId,blocks,tags:[],favorite:false,createdAt:now,updatedAt:now});let home=p("خانه",null,[B("h1","دفتر جزوه‌های پنتست وب"),B("text","دفتر شخصی و مستقل تو. صفحه بساز، زیرصفحه اضافه کن و مستقیم بنویس."),B("h2","شروع سریع"),B("bullet","در ابتدای هر بلاک / را بزن تا نوع آن را عوض کنی."),B("bullet","Ctrl + K جست‌وجو در همه یادداشت‌ها"),B("quote","قبل از هر آزمون، مجوز صریح و Scope را مشخص کن.")]);let sql=p("SQL Injection",null,[B("h1","SQL Injection"),B("text","دستورها و نکات هر شاخه را در صفحه خودش نگه دار.")]);let blind=p("Blind",sql.id,[B("h1","Blind SQL Injection")]);let time=p("Time-Based",blind.id,[B("h1","Time-Based SQL Injection"),B("text","کنترل True و False را مقایسه کن.")]);let mysql=p("MySQL",time.id,[B("h1","MySQL Time-Based"),B("code","' AND IF(1=1,SLEEP(5),0)-- -"),B("code","' AND IF(1=2,SLEEP(5),0)-- -"),B("flash","کنترل False چرا لازم است؟",{answer:"برای جدا کردن تأخیر پیلود از تأخیر شبکه یا سرور."})]);home.favorite=true;return[home,sql,blind,time,mysql,p("Cross-Site Scripting")]}
let pages;try{pages=JSON.parse(localStorage.getItem(KEY))||seed()}catch{pages=seed()}
let activeId=pages[0]?.id,expanded=new Set(pages.filter(p=>!p.parentId).map(p=>p.id)),filter="",modal="",preview=false,dark=localStorage.getItem("new-daftar-theme")!=="light",card=0,flip=false;
const root=$("#root");
function save(){localStorage.setItem(KEY,JSON.stringify(pages))}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2300)}
function visible(p){let seen=new Set();while(p){if(p.deletedAt||seen.has(p.id))return false;seen.add(p.id);p=pages.find(x=>x.id===p.parentId)}return true}
const vis=()=>pages.filter(visible),active=()=>vis().find(p=>p.id===activeId)||vis()[0];
function crumbs(p){let a=[];while(p){a.unshift(p);p=pages.find(x=>x.id===p.parentId)}return a}
function allCards(){return vis().flatMap(p=>p.blocks.filter(b=>b.type==="flash").map(b=>({...b,page:p.title})))}
async function sha(t){let b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function auth(){let lock=JSON.parse(localStorage.getItem(LOCK)||"null");root.innerHTML=`<main class="auth"><form><div class="logo"><span>▤</span><div><b>Daftar</b><p>${lock?"ورود به دفتر":"ساخت دفتر کاملاً جدید"}</p></div></div><label>نام کاربری<input name="u" value="${esc(lock?.u||"")}" required autofocus></label><label>رمز عبور<input name="p" type="password" minlength="4" required></label>${lock?"":'<label>تکرار رمز<input name="c" type="password" minlength="4" required></label>'}<p class="error"></p><button class="primary">${lock?"ورود":"ساخت و باز کردن دفتر"}</button><p class="note">یادداشت‌ها و قفل فقط در همین مرورگر ذخیره می‌شوند؛ این احراز هویت سروری نیست.</p></form></main>`;$("form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),u=f.get("u").trim(),p=f.get("p");if(!lock&&p!==f.get("c"))return $(".error").textContent="تکرار رمز یکسان نیست.";let h=await sha(u+":"+p);if(lock&&(u!==lock.u||h!==lock.h))return $(".error").textContent="نام کاربری یا رمز اشتباه است.";if(!lock)localStorage.setItem(LOCK,JSON.stringify({u,h}));sessionStorage.setItem(SESSION,"1");render()}}
function tree(parent=null,d=0){return pages.filter(p=>p.parentId===parent&&visible(p)&&(!filter||p.favorite||vis().some(c=>c.favorite&&crumbs(c).some(x=>x.id===p.id)))).map(p=>{let kids=pages.some(x=>x.parentId===p.id&&visible(x));return`<div class="row ${p.id===active()?.id?"active":""}" style="--d:${d}"><button class="exp" data-exp="${p.id}">${kids?(expanded.has(p.id)?"⌄":"‹"):""}</button><button class="label" data-open="${p.id}">▤ ${esc(p.title||"بدون عنوان")} ${p.favorite?"♥":""}</button><button class="add" data-add="${p.id}" title="زیرصفحه">＋</button></div>${kids&&expanded.has(p.id)?tree(p.id,d+1):""}`}).join("")}
function blockHtml(b,i){let common=`data-b="${b.id}" data-i="${i}"`,area=`<textarea ${common} rows="1" placeholder="بنویس یا / را بزن…">${esc(b.text)}</textarea>`,body=area;if(b.type==="code")body=area;if(b.type==="flash")body=`${area}<textarea class="answer" data-answer="${b.id}" rows="1" placeholder="جواب فلش‌کارت">${esc(b.answer||"")}</textarea>`;if(b.type==="divider")body="";if(b.type==="image")body=`<div>${b.text?`<img src="${b.text}" alt="تصویر">`:""}<input type="file" accept="image/*" data-image="${b.id}"></div>`;return`<div class="block ${b.type} ${b.checked?"done":""}" data-wrap="${b.id}"><div class="tools"><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-del="${b.id}">×</button></div>${body}${b.text.startsWith("/")?`<div class="slash">${[["text","متن"],["h1","تیتر ۱"],["h2","تیتر ۲"],["h3","تیتر ۳"],["bullet","لیست"],["numbered","لیست عددی"],["todo","چک‌لیست"],["code","کد"],["quote","نقل‌قول"],["flash","فلش‌کارت"],["image","تصویر"],["divider","جداکننده"]].map(x=>`<button data-type="${x[0]}" data-id="${b.id}"><span>${x[1]}</span><small>${x[0]}</small></button>`).join("")}</div>`:""}</div>`}
function previewHtml(p){return`<article class="preview"><h1>${esc(p.title)}</h1>${p.blocks.map(b=>b.type==="code"?`<pre>${esc(b.text)}</pre>`:b.type==="quote"?`<blockquote>${esc(b.text)}</blockquote>`:b.type==="divider"?"<hr>":b.type==="image"?(b.text?`<img style="max-width:100%" src="${b.text}">`:""):b.type==="flash"?`<p><b>${esc(b.text)}</b><br>${esc(b.answer)}</p>`:`<p>${b.type==="bullet"?"• ":b.type==="todo"?(b.checked?"☑ ":"☐ "):""}${esc(b.text)}</p>`).join("")}</article>`}
function render(){document.documentElement.classList.toggle("light",!dark);let p=active();if(!p){pages=seed();activeId=pages[0].id;p=active()}root.innerHTML=`<div class="app"><button class="scrim" aria-label="بستن"></button><aside class="sidebar"><div class="brand"><span>▤</span><div><b>Daftar</b><small>دفتر مستقل تو</small></div><button class="icon close">×</button></div><button class="new">＋ صفحه جدید <kbd>Ctrl N</kbd></button><button class="search">⌕ جست‌وجو در دفتر… <kbd>Ctrl K</kbd></button><nav class="nav"><button class="${!filter?"active":""}" data-filter="all">▤ همه صفحه‌ها <i>${vis().length}</i></button><button class="${filter?"active":""}" data-filter="fav">♥ محبوب‌ها <i>${vis().filter(x=>x.favorite).length}</i></button><button data-modal="cards">ϟ فلش‌کارت <i>${allCards().length}</i></button></nav><div class="treehead"><span>صفحه‌ها</span><button class="addroot">＋</button></div><div class="tree">${tree()}</div><div class="bottom"><button data-modal="trash">♲ سطل زباله</button><button data-modal="export">⇩ پشتیبان‌گیری و خروجی</button><div class="local">ذخیره محلی فعال است</div></div></aside><main class="main"><header class="top"><div class="topstart"><button class="icon menu">☰</button><div class="crumbs">${crumbs(p).map(x=>`<button data-open="${x.id}">${esc(x.title)}</button>`).join(" ‹ ")}</div></div><div class="actions"><button class="icon undo" title="واگرد">↶</button><button class="textbtn ${preview?"active":""}" data-preview>${preview?"ویرایش":"پیش‌نمایش"}</button><button class="icon" data-theme>${dark?"☼":"☾"}</button></div></header><div class="scroll"><div class="doc"><div class="meta"><span>صفحه · ${new Date(p.updatedAt).toLocaleDateString("fa-IR")}</span><div class="pagetools"><button class="icon" data-fav>${p.favorite?"♥":"♡"}</button><button class="icon" data-md title="Markdown">⇩</button><button class="icon" data-delete title="حذف">♲</button></div></div><textarea class="title" rows="1" placeholder="بدون عنوان">${esc(p.title)}</textarea><div class="tags"># ${p.tags.map(t=>`<button data-tag="${esc(t)}">${esc(t)} ×</button>`).join("")}<input placeholder="افزودن برچسب…"></div>${preview?previewHtml(p):`<section class="editor">${p.blocks.map(blockHtml).join("")}</section><button class="addblock">＋ بلاک جدید</button>`}</div></div><footer class="status"><span>${p.blocks.length} بلاک</span><span>${p.blocks.reduce((n,b)=>n+b.text.length,0).toLocaleString("fa-IR")} کاراکتر</span><button data-lock>قفل دفتر ↪</button></footer></main></div><div class="modals"></div>`;bind();autosize();save()}
function autosize(){$("textarea");$$("textarea").forEach(t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"})}
function patch(id,obj){pages=pages.map(p=>p.id===id?{...p,...obj,updatedAt:Date.now()}:p);save()}
function create(parentId=null){let now=Date.now(),p={id:uid(),title:"صفحه بدون عنوان",parentId,blocks:[B()],tags:[],favorite:false,createdAt:now,updatedAt:now};pages.push(p);activeId=p.id;if(parentId)expanded.add(parentId);render();$(".title").focus();$(".title").select()}
function changeBlocks(id,fn){let p=pages.find(x=>x.id===id);p.blocks=fn(p.blocks);p.updatedAt=Date.now();save()}
function download(name,text,type="text/plain"){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function markdown(p){return`# ${p.title}\n\n`+p.blocks.map(b=>b.type==="code"?"```\n"+b.text+"\n```":b.type==="h1"?"## "+b.text:b.type==="h2"?"### "+b.text:b.type==="h3"?"#### "+b.text:b.type==="bullet"?"- "+b.text:b.type==="todo"?`- [${b.checked?"x":" "}] ${b.text}`:b.type==="quote"?"> "+b.text:b.type==="divider"?"---":b.type==="flash"?`**سؤال:** ${b.text}\n\n**جواب:** ${b.answer||""}`:b.text).join("\n\n")}
function openModal(type){modal=type;let html="";if(type==="search")html=`<h2>جست‌وجو در دفتر</h2><div class="modalbody"><input autofocus placeholder="عنوان، متن یا دستور…"><div class="results"></div></div>`;if(type==="cards"){let c=allCards();html=`<h2>مرور فلش‌کارت</h2><div class="modalbody">${c.length?`<div class="study"><p>${esc(flip?c[card%c.length].answer:c[card%c.length].text)}</p><small>${flip?"جواب":"برای دیدن جواب کلیک کن"}</small></div><div class="cardnav"><button data-card="-1">قبلی</button><span>${card%c.length+1} / ${c.length}</span><button data-card="1">بعدی</button></div>`:'<p class="empty">هنوز فلش‌کارتی نساخته‌ای.</p>'}</div>`}if(type==="trash"){let d=pages.filter(p=>p.deletedAt);html=`<h2>سطل زباله</h2><div class="modalbody">${d.length?d.map(p=>`<div class="trashitem"><span>${esc(p.title)}</span><button data-restore="${p.id}">بازیابی</button><button data-forever="${p.id}">حذف دائم</button></div>`).join(""):'<p class="empty">سطل زباله خالی است.</p>'}</div>`}if(type==="export")html=`<h2>پشتیبان‌گیری و خروجی</h2><div class="modalbody export"><button data-json><span>⇩</span><div><b>پشتیبان کامل JSON</b><small>برای بازیابی تمام صفحه‌ها</small></div></button><button data-allmd><span>⇩</span><div><b>خروجی Markdown / Obsidian</b><small>دانلود همه صفحه‌ها در یک فایل</small></div></button><button data-import><span>⇧</span><div><b>بازیابی پشتیبان JSON</b><small>جایگزین کردن دفتر فعلی</small></div></button><input class="hidden" type="file" accept=".json"><p class="note">برای حفظ اطلاعات، منظم پشتیبان JSON بگیر.</p></div>`;$(".modals").innerHTML=`<div class="modalback"><section class="modal"><header>${html.split('<div class="modalbody">')[0]}<button class="icon closemodal">×</button></header><div class="modalbody">${html.split('<div class="modalbody">')[1]||""}</div></section></div>`;$(".closemodal").onclick=()=>{$(".modals").innerHTML="";modal=""};$(".modalback").onclick=e=>{if(e.target.classList.contains("modalback"))$(".closemodal").click()};if(type==="search"){let input=$(".modalbody>input");let results=q=>{$(".results").innerHTML=vis().filter(p=>(p.title+p.tags.join(" ")+p.blocks.map(b=>b.text+" "+(b.answer||"")).join(" ")).toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="result" data-result="${p.id}"><span><b>${esc(p.title)}</b><small>${crumbs(p).map(x=>esc(x.title)).join(" / ")}</small></span>←</button>`).join("")||'<p class="empty">نتیجه‌ای نیست.</p>';$$("[data-result]").forEach(b=>b.onclick=()=>{activeId=b.dataset.result;preview=false;render()})};input.oninput=()=>results(input.value);results("")}if(type==="cards"){$(".study")?.addEventListener("click",()=>{flip=!flip;openModal("cards")});$$("[data-card]").forEach(b=>b.onclick=()=>{let c=allCards();card=(card+Number(b.dataset.card)+c.length)%c.length;flip=false;openModal("cards")})}bindModal()}
function bindModal(){$$("[data-restore]").forEach(b=>b.onclick=()=>{patch(b.dataset.restore,{deletedAt:undefined});openModal("trash");render()});$$("[data-forever]").forEach(b=>b.onclick=()=>{let ids=new Set([b.dataset.forever]);let change=true;while(change){change=false;pages.forEach(p=>{if(p.parentId&&ids.has(p.parentId)&&!ids.has(p.id)){ids.add(p.id);change=true}})}pages=pages.filter(p=>!ids.has(p.id));openModal("trash");render()});$("[data-json]")?.addEventListener("click",()=>download("daftar-backup.json",JSON.stringify({version:1,pages},null,2),"application/json"));$("[data-allmd]")?.addEventListener("click",()=>download("daftar-obsidian.md",vis().map(markdown).join("\n\n---\n\n"),"text/markdown"));$("[data-import]")?.addEventListener("click",()=>$(".export input[type=file]").click());$(".export input[type=file]")?.addEventListener("change",async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.pages))throw 0;pages=d.pages;activeId=pages.find(p=>!p.deletedAt)?.id;render();toast("پشتیبان بازیابی شد")}catch{toast("فایل معتبر نیست")}})}
function bind(){$$(".menu").forEach(b=>b.onclick=()=>{$(".sidebar").classList.add("open");$(".scrim").classList.add("show")});$(".close").onclick=$(".scrim").onclick=()=>{$(".sidebar").classList.remove("open");$(".scrim").classList.remove("show")};$(".new").onclick=$(".addroot").onclick=()=>create();$(".search").onclick=()=>openModal("search");$$("[data-modal]").forEach(b=>b.onclick=()=>openModal(b.dataset.modal));$$("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter==="fav"?"fav":"";render()});$$("[data-open]").forEach(b=>b.onclick=()=>{activeId=b.dataset.open;preview=false;render()});$$("[data-add]").forEach(b=>b.onclick=()=>create(b.dataset.add));$$("[data-exp]").forEach(b=>b.onclick=()=>{expanded.has(b.dataset.exp)?expanded.delete(b.dataset.exp):expanded.add(b.dataset.exp);render()});$("[data-theme]").onclick=()=>{dark=!dark;localStorage.setItem("new-daftar-theme",dark?"dark":"light");render()};$("[data-preview]").onclick=()=>{preview=!preview;render()};$("[data-fav]").onclick=()=>{patch(activeId,{favorite:!active().favorite});render()};$("[data-md]").onclick=()=>download(active().title+".md",markdown(active()),"text/markdown");$("[data-delete]").onclick=()=>{if(confirm("این صفحه به سطل زباله برود؟")){patch(activeId,{deletedAt:Date.now()});activeId=vis()[0]?.id;render()}};$("[data-lock]").onclick=()=>{sessionStorage.removeItem(SESSION);auth()};$(".title").oninput=e=>{patch(activeId,{title:e.target.value});autosize();$$(".crumbs button").at(-1).textContent=e.target.value};$(".tags input").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){patch(activeId,{tags:[...active().tags,e.target.value.trim().replace(/^#/,"")]});render()}};$$("[data-tag]").forEach(b=>b.onclick=()=>{patch(activeId,{tags:active().tags.filter(t=>t!==b.dataset.tag)});render()});$(".addblock").onclick=()=>{changeBlocks(activeId,a=>[...a,B()]);render();$$(".block textarea").at(-1).focus()};$$("[data-b]").forEach(t=>{t.oninput=()=>{let id=t.dataset.b,b=active().blocks.find(x=>x.id===id);b.text=t.value;active().updatedAt=Date.now();save();t.style.height="auto";t.style.height=t.scrollHeight+"px";if(t.value.startsWith("/")&&!$(".slash"))render()};t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&active().blocks[t.dataset.i].type!=="code"){e.preventDefault();changeBlocks(activeId,a=>{let n=[...a];n.splice(Number(t.dataset.i)+1,0,B(a[t.dataset.i].type==="flash"?"text":a[t.dataset.i].type));return n});render();$$("[data-b]")[Number(t.dataset.i)+1]?.focus()}if(e.key==="Backspace"&&!t.value&&active().blocks.length>1){e.preventDefault();changeBlocks(activeId,a=>a.filter(b=>b.id!==t.dataset.b));render()}}});$$("[data-answer]").forEach(t=>t.oninput=()=>{active().blocks.find(b=>b.id===t.dataset.answer).answer=t.value;save()});$$("[data-type]").forEach(b=>b.onclick=()=>{changeBlocks(activeId,a=>a.map(x=>x.id===b.dataset.id?{...x,type:b.dataset.type,text:""}:x));render()});$$("[data-del]").forEach(b=>b.onclick=()=>{changeBlocks(activeId,a=>a.filter(x=>x.id!==b.dataset.del));render()});$$("[data-up],[data-down]").forEach(b=>b.onclick=()=>{let i=Number(b.dataset.up??b.dataset.down),d=b.dataset.up!==undefined?-1:1;if(i+d<0||i+d>=active().blocks.length)return;changeBlocks(activeId,a=>{let n=[...a];[n[i],n[i+d]]=[n[i+d],n[i]];return n});render()});$$(".todo").forEach(el=>el.onclick=e=>{if(e.target===el){changeBlocks(activeId,a=>a.map(b=>b.id===el.dataset.wrap?{...b,checked:!b.checked}:b));render()}});$$("[data-image]").forEach(inp=>inp.onchange=()=>{let f=inp.files[0];if(!f||f.size>8e6)return toast("تصویر باید کمتر از ۸ مگابایت باشد");let r=new FileReader();r.onload=()=>{changeBlocks(activeId,a=>a.map(b=>b.id===inp.dataset.image?{...b,text:r.result}:b));render()};r.readAsDataURL(f)})}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openModal("search")}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"){e.preventDefault();create()}if(e.key==="Escape")$(".closemodal")?.click()});
if(sessionStorage.getItem(SESSION))render();else auth();
</script>
</body>
</html>
