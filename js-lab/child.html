<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اتاق بغلی</title>
  <style>
    body { margin: 0; padding: 12px; font-family: Vazirmatn, Tahoma, sans-serif; background: #fffdf7; color: #2a2118; }
    .tag { color: #6d6256; font-size: 13px; margin-bottom: 8px; }
    #board { min-height: 70px; border: 1px dashed #ead9b6; border-radius: 12px; padding: 10px; background: #fff; }
  </style>
</head>
<body>
  <div class="tag">اتاق بغلی — هر نامه را همان‌طور که هست روی میز می‌گذارد</div>
  <div id="board">هنوز نامه‌ای نیامده</div>
  <script>
    window.addEventListener("message", function (event) {
      document.getElementById("board").innerHTML = event.data;
    });
  </script>
</body>
</html>
