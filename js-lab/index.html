<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe4" />
  <title>اتاق‌های صفحه</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">0</div>
        <div>
          <h1>اتاق‌های صفحه</h1>
          <p>از صفر، مثل کلاس اول</p>
        </div>
      </div>
      <div class="progress-wrap">
        <span id="prog-text">0 از 9</span>
        <div class="bar"><i id="prog-bar"></i></div>
      </div>
    </header>
    <section id="home" class="screen active">
      <div class="hero">
        <h2>یک اتاق، یک کشف</h2>
        <p>لازم نیست برنامه‌نویسی بلد باشی. هر اتاق یک کار کوچک است. اول ببین، بعد عوض کن، آخر اسمش را یاد بگیر. تا دفترچه را ننویسی، در بعدی باز نمی‌شود.</p>
      </div>
      <div class="grid" id="level-list"></div>
      <div class="row" style="margin-top:14px"><button id="reset">از اول</button></div>
    </section>
    <section id="lesson" class="screen"></section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/main.js?v=kid"></script>
</body>
</html>
