<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <title>آزمایشگاه امنیت جاوااسکریپت</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="icons/icon.svg" alt="" />
        <div>
          <h1>آزمایشگاه امنیت JS</h1>
          <p>یادگیری با ساختن و شکستن</p>
        </div>
      </div>
      <div class="progress-wrap">
        <span id="prog-text">0 از 8</span>
        <div class="bar"><i id="prog-bar"></i></div>
      </div>
    </header>
    <section id="home" class="screen active">
      <div class="hero">
        <h2>با دست بزن، بعد در ذهنت می‌ماند</h2>
        <p>هشت آزمایش کوتاه برای XSS، DOM، postMessage، SOP و Prototype Pollution.</p>
      </div>
      <div class="grid" id="level-list"></div>
      <div class="row"><button id="reset">شروع دوباره</button></div>
    </section>
    <section id="lesson" class="screen"></section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/gh/mmlisteam-bot/js-security-lab@main/js/main.js"></script>
</body>
</html>
