<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>child frame — postMessage sink</title>
  <style>
    body{font:13px/1.45 ui-monospace,monospace;margin:10px;background:#111;color:#ddd}
    #box{padding:8px;border:1px dashed #555;min-height:52px;background:#1a1a1a}
    .meta{color:#888;font-size:11px;margin-top:6px}
  </style>
</head>
<body>
  <div>child origin: <span id="me"></span></div>
  <div id="box">waiting for message…</div>
  <div class="meta" id="meta"></div>
  <script>
    document.getElementById("me").textContent = location.origin;
    window.addEventListener("message", function (event) {
      document.getElementById("meta").textContent =
        "event.origin=" + event.origin + "  event.source=" + (event.source === window.parent ? "parent" : "?");
      document.getElementById("box").innerHTML = String(event.data);
    });
  </script>
</body>
</html>
